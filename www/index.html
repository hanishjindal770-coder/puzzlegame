<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A no-login block puzzle. Drag pieces, clear lines, chain combos.">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>
<style>
@font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: swap; src: url(fonts/baloo2.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: swap; src: url(fonts/nunito.woff2) format("woff2"); }

<title>Tidepool Blocks</title>
<meta name="theme-color" content="#0A1F2E">
<style>
/* Layout: one-screen portrait app. HUD on top, square board + piece tray on a canvas, dock of actions at the bottom.
   Each theme is a single committed look, so colors are set from JS per theme (no light/dark split). */
:root {
  --bg1: #0F3346; --bg2: #0A1F2E; --ink: #EAF6F4; --muted: #8FB3BC;
  --accent: #F5C451; --accent-ink: #2B1E00; --panel: #0B2534; --line: #14374A;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg2); color: var(--ink); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#app {
  height: 100%; display: flex; flex-direction: column; box-sizing: border-box;
  background: radial-gradient(120% 70% at 50% 0%, var(--bg1), var(--bg2));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px;
  transition: background .4s;
}
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; max-width: 520px; width: 100%; margin: 0 auto; }
.best { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
.lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
#best { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.score-wrap { text-align: center; line-height: 1; }
#score { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 56px); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
#combo { display: inline-block; margin-top: 2px; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; font-size: 14px; }
#combo.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
.coins { justify-self: end; display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 0; background: var(--panel); color: var(--ink); font: 800 16px var(--display); font-variant-numeric: tabular-nums; cursor: pointer; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF2B3, #F5C451 45%, #C98A12); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); flex: none; }
.coins.pulse { animation: bump .4s ease-out; }
.bar { max-width: 520px; width: 100%; margin: 8px auto 0; height: 6px; border-radius: 6px; background: var(--panel); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 6px; transition: width .3s; }
.bar.beat i { background: linear-gradient(90deg, var(--accent), #fff, var(--accent)); background-size: 200% 100%; animation: shine 1.2s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#cv { display: block; touch-action: none; }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 2%; font-weight: 800; font-size: 14px; color: var(--muted); pointer-events: none; animation: breathe 1.6s ease-in-out infinite; white-space: nowrap; }
@keyframes breathe { 50% { opacity: .45; } }
.dock { display: flex; justify-content: center; gap: 6px; max-width: 520px; width: 100%; margin: 0 auto; }
.dock button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font: 800 11px var(--body); letter-spacing: .02em; cursor: pointer; position: relative; }
.dock button:active { background: var(--panel); }
.dock svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: #FF5A5F; box-shadow: 0 0 0 2px var(--bg2); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); animation: fade .2s; }
@media (min-height: 640px) { #modal { align-items: center; } }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 420px; max-height: 88%; overflow-y: auto; box-sizing: border-box; background: var(--panel); border-radius: 24px; padding: 22px 18px 18px; animation: rise .28s cubic-bezier(.2,1.3,.4,1); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
@keyframes rise { from { transform: translateY(40px) scale(.96); opacity: 0; } }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0 0 4px; text-align: center; text-wrap: balance; line-height: 1.1; }
.sheet p.sub { margin: 0 0 16px; text-align: center; color: var(--muted); font-weight: 700; }
.big { font-family: var(--display); font-weight: 800; font-size: 64px; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; }
.btn { flex: 1; border: 0; border-radius: 16px; padding: 14px 12px; font: 800 18px var(--display); cursor: pointer; background: var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn[disabled] { opacity: .45; cursor: default; }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.near { text-align: center; font-weight: 800; color: var(--accent); margin: 6px 0 0; }
.earn { display: flex; justify-content: center; align-items: center; gap: 6px; font-weight: 800; margin-top: 10px; color: var(--muted); }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day { border-radius: 14px; background: var(--line); padding: 10px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; }
.day small { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.day.done { opacity: .5; }
.day.today { background: var(--accent); color: var(--accent-ink); }
.day.today small { color: var(--accent-ink); }
.day.d7 { grid-column: span 2; }
.mission { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--line); border-radius: 16px; padding: 12px 14px; }
.mission b { font-size: 15px; }
.mission .prog { grid-column: 1; height: 8px; border-radius: 8px; background: var(--bg2); overflow: hidden; }
.mission .prog i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
.mission .count { grid-column: 1; font-size: 12px; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.mission .act { grid-column: 2; grid-row: 1 / span 3; }
.claim { border: 0; border-radius: 12px; padding: 10px 12px; font: 800 15px var(--display); background: var(--accent); color: var(--accent-ink); cursor: pointer; display: flex; gap: 6px; align-items: center; }
.claim[disabled] { background: transparent; color: var(--muted); cursor: default; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme { border: 2px solid transparent; border-radius: 16px; padding: 10px; cursor: pointer; text-align: left; font: inherit; display: flex; flex-direction: column; gap: 8px; }
.theme.on { border-color: var(--accent); }
.theme .sw { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.theme .sw i { aspect-ratio: 1; border-radius: 4px; }
.theme .nm { font-weight: 800; font-size: 14px; }
.theme .pr { font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.theme .pr .coin { width: 13px; height: 13px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.stats div { background: var(--line); border-radius: 12px; padding: 8px 10px; }
.stats b { display: block; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
#toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -150%); z-index: 30; background: var(--accent); color: var(--accent-ink); font: 800 15px var(--display); padding: 10px 16px; border-radius: 999px; transition: transform .35s cubic-bezier(.2,1.4,.4,1); white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
#toast.show { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="best"><span class="lbl">Best</span><span id="best">0</span></div>
    <div class="score-wrap"><div id="score">0</div><div id="combo" hidden>Combo ×2</div></div>
    <button id="coinsBtn" class="coins" aria-label="Coins and themes"><span class="coin"></span><span id="coins">0</span></button>
  </header>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div id="stage"><canvas id="cv" aria-label="Game board"></canvas><div id="hint" hidden>Drag a piece onto the board</div></div>
  <nav class="dock">
    <button id="bMissions"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Missions<span class="dot" id="mDot" hidden></span></button>
    <button id="bDaily"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/></svg>Daily<span class="dot" id="dDot" hidden></span></button>
    <button id="bThemes"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5 1-1.5 2-1.5h2a4 4 0 0 0 4-4c0-4.5-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>Themes</button>
    <button id="bSound"><svg viewBox="0 0 24 24" id="sndIcon"></svg><span id="sndLbl">Sound</span></button>
    <button id="bNew"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>New game</button>
  </nav>
  <div id="toast"></div>
  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>
</div>

<script>
(() => {
'use strict';
const N = 8, KEY = 'tidepool-blocks-v1';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------- themes ---------- */
const THEMES = [
  { id:'tide', name:'Tidepool', price:0, bg1:'#0F3346', bg2:'#0A1F2E', board:'#0B2534', empty:'#14374A', ink:'#EAF6F4', muted:'#8FB3BC', accent:'#F5C451', accentInk:'#2B1E00',
    pieces:['#4FD1C1','#F5C451','#F48C68','#7FB0F5','#BE95F2','#78DC8A','#F278A6'] },
  { id:'citrus', name:'Citrus Grove', price:150, bg1:'#FFF6E4', bg2:'#FFE0B0', board:'#F0CF9C', empty:'#E8C28A', ink:'#3B2412', muted:'#8A6440', accent:'#E8590C', accentInk:'#FFFFFF',
    pieces:['#FF8A1F','#FFC93C','#8CC63F','#2FA77A','#F25C54','#FF7EB6','#3E95D6'] },
  { id:'candy', name:'Candy Shop', price:300, bg1:'#4A1840', bg2:'#25091F', board:'#36102D', empty:'#4D1B43', ink:'#FFEAF6', muted:'#D59ACB', accent:'#FF7EC8', accentInk:'#3A0026',
    pieces:['#FF7EC8','#FFD166','#8CF0E0','#B69CFF','#FF9A76','#A0E77D','#7FC8FF'] },
  { id:'neon', name:'Night Arcade', price:500, bg1:'#1A1645', bg2:'#08061C', board:'#0E0B2B', empty:'#1C1847', ink:'#EDEBFF', muted:'#9A93D6', accent:'#45F0DF', accentInk:'#04201D',
    pieces:['#45F0DF','#FF4FD8','#FFE14D','#7C6CFF','#FF8A3D','#5CFF7A','#FF4F6E'] },
  { id:'ember', name:'Ember', price:800, bg1:'#3E1B12', bg2:'#1A0A06', board:'#2B120C', empty:'#3E1C13', ink:'#FFEDE2', muted:'#C99A85', accent:'#FFB347', accentInk:'#2A1200',
    pieces:['#FF6B3D','#FFB347','#FFD98A','#E8434F','#C77DFF','#F2E6D0','#FF8FA3'] },
];
let T = THEMES[0];

/* ---------- color helpers ---------- */
const mixCache = new Map();
function mix(a, b, t) {
  const k = a + b + t; if (mixCache.has(k)) return mixCache.get(k);
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b), r = A.map((v, i) => Math.round(v + (B[i] - v) * t));
  const out = '#' + r.map(v => v.toString(16).padStart(2, '0')).join(''); mixCache.set(k, out); return out;
}

/* ---------- save data ---------- */
function defaults() {
  return { best:0, coins:0, theme:'tide', owned:['tide'], sound:true,
    stats:{ games:0, lines:0, bestCombo:0, pieces:0 }, daily:{ last:'', streak:0 }, missions:null, run:null, seenHint:false };
}
let S = defaults();
function load(data) {
  let d = data;
  if (!d) { try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; } }
  if (d && typeof d === 'object') S = Object.assign(defaults(), d, { stats:Object.assign(defaults().stats, d.stats || {}) });
}
function save() { saveNow(); }
function saveNow() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- dates & seeded rng ---------- */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); };
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}

/* ---------- shapes ---------- */
function norm(cells) {
  const mr = Math.min(...cells.map(c => c[0])), mc = Math.min(...cells.map(c => c[1]));
  return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
const rot = cells => norm(cells.map(([r, c]) => [c, -r]));
function variants(base, n) {
  const out = [], seen = new Set(); let c = norm(base);
  for (let i = 0; i < n; i++) { const k = JSON.stringify(c); if (!seen.has(k)) { seen.add(k); out.push(c); } c = rot(c); }
  return out;
}
const rect = (h, w) => { const a = []; for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) a.push([r, c]); return a; };
const SHAPES = [];
function add(list, w, big) { list.forEach(cells => SHAPES.push({ cells, w, big, h:Math.max(...cells.map(c => c[0])) + 1, wd:Math.max(...cells.map(c => c[1])) + 1 })); }
add([rect(1,1)], 2.5, 0);
add(variants(rect(1,2), 2), 3, 0);
add(variants(rect(1,3), 2), 3, 0);
add(variants(rect(1,4), 2), 2, 1);
add(variants(rect(1,5), 2), 1, 2);
add([rect(2,2)], 4, 0);
add([rect(3,3)], 1.2, 2);
add(variants(rect(2,3), 2), 1.2, 1);
add(variants([[0,0],[1,0],[1,1]], 4), 2.2, 0);
add(variants([[0,0],[1,0],[2,0],[2,1],[2,2]], 4), 0.9, 2);
add(variants([[0,0],[1,0],[2,0],[2,1]], 4), 1, 1);
add(variants([[0,1],[1,1],[2,1],[2,0]], 4), 1, 1);
add(variants([[0,0],[0,1],[0,2],[1,1]], 4), 1.1, 1);
add(variants([[0,0],[0,1],[1,1],[1,2]], 2), 0.9, 1);
add(variants([[0,1],[0,2],[1,0],[1,1]], 2), 0.9, 1);

/* ---------- board logic ---------- */
const fits = (b, cells, r, c) => cells.every(([dr, dc]) => { const R = r + dr, C = c + dc; return R >= 0 && R < N && C >= 0 && C < N && !b[R * N + C]; });
function fitsAnywhere(b, p) { for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.wd; c++) if (fits(b, p.cells, r, c)) return true; return false; }
function fullLines(b) {
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    let rf = true, cf = true;
    for (let j = 0; j < N; j++) { if (!b[i * N + j]) rf = false; if (!b[j * N + i]) cf = false; }
    if (rf) rows.push(i); if (cf) cols.push(i);
  }
  return { rows, cols };
}
function simPlace(b, p, r, c) {
  const nb = b.slice(); p.cells.forEach(([dr, dc]) => { nb[(r + dr) * N + c + dc] = 1; });
  const { rows, cols } = fullLines(nb);
  rows.forEach(R => { for (let j = 0; j < N; j++) nb[R * N + j] = 0; });
  cols.forEach(C => { for (let j = 0; j < N; j++) nb[j * N + C] = 0; });
  return { nb, lines: rows.length + cols.length };
}
function bestMove(b, p) {
  let best = null;
  for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.wd; c++) {
    if (!fits(b, p.cells, r, c)) continue;
    const s = simPlace(b, p, r, c);
    if (!best || s.lines > best.lines) best = s;
  }
  return best;
}
const PERMS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function solvable(b, set) {
  return PERMS.some(order => { let bb = b; for (const i of order) { const m = bestMove(bb, set[i]); if (!m) return false; bb = m.nb; } return true; });
}
function helpfulness(b, set) { return set.reduce((s, p) => { const m = bestMove(b, p); return s + (m ? m.lines : -1); }, 0); }

/* Piece generator: weighted random, nudged toward sets the player can actually place
   (that's the "fair but tense" feel). As the score climbs, big pieces get likelier and the safety net loosens. */
function randPiece(score) {
  const grow = Math.min(2.2, 1 + score / 2500);
  const ws = SHAPES.map(s => s.w * (s.big ? Math.pow(grow, s.big) : 1));
  let t = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
  while ((t -= ws[i]) > 0) i++;
  const s = SHAPES[i];
  return { cells:s.cells, h:s.h, wd:s.wd, color:1 + Math.floor(Math.random() * 7) };
}
function genTray(b, score) {
  const fill = b.filter(Boolean).length / (N * N);
  const risky = Math.random() < Math.min(0.3, score / 12000);
  let last = null; const good = [];
  for (let k = 0; k < 40 && good.length < 4; k++) {
    const set = [randPiece(score), randPiece(score), randPiece(score)]; last = set;
    if (risky) { if (set.some(p => fitsAnywhere(b, p))) return set; continue; }
    if (solvable(b, set)) good.push(set);
  }
  if (!good.length) return last;
  if (fill > 0.4) good.sort((x, y) => helpfulness(b, y) - helpfulness(b, x));
  return good[0];
}

/* ---------- missions ---------- */
const MT = {
  lines:  { txt:n => `Clear ${n} lines`, opts:[15, 25, 40], reward:30 },
  combo:  { txt:n => `Reach a ×${n} combo`, opts:[3, 4, 6], reward:40 },
  score:  { txt:n => `Score ${n.toLocaleString()} in one game`, opts:[800, 1500, 2500], reward:40 },
  multi:  { txt:n => `Clear ${n} lines with one piece`, opts:[2, 3], reward:35 },
  games:  { txt:n => `Play ${n} games`, opts:[2, 3, 5], reward:25 },
  place:  { txt:n => `Place ${n} pieces`, opts:[50, 80, 120], reward:25 },
};
function ensureMissions() {
  const d = today();
  if (S.missions && S.missions.date === d) return;
  const rnd = seeded('m' + d), types = Object.keys(MT);

    <div class="days">${REWARDS.map((v, i) => `<div class="day ${i === 6 ? 'd7' : ''} ${i + 1 < cur || (claimed && i + 1 === cur) ? 'done' : ''} ${!claimed && i + 1 === cur ? 'today' : ''}">
      <small>Day ${i + 1}</small><span class="coin"></span>${v}</div>`).join('')}</div>
    <div class="stack">${claimed ? '' : `<button class="btn primary" id="claimDaily">Claim ${REWARDS[cur - 1]} coins</button>`}${claimed ? closeBtn.replace('<div class="stack">', '').replace('</div>', '') : ''}</div>`);
  if (!claimed) $('claimDaily').onclick = () => {
    S.daily = { last:today(), streak:cur }; S.coins += REWARDS[cur - 1]; saveNow(); sfx.coin(); buzz(20); closeSheet(); coinPulse(); toast(`+${REWARDS[cur - 1]} coins. See you tomorrow!`);
  };
}
function showMissions() {
  ensureMissions();
  const st = S.stats;
  sheet(`<h2>Today's missions</h2><p class="sub">New missions every day</p><div class="stack" style="margin-top:0">
    ${S.missions.list.map((m, i) => { const done = m.prog >= m.goal;
      return `<div class="mission"><b>${MT[m.t].txt(m.goal)}</b><div class="prog"><i style="width:${m.prog / m.goal * 100}%"></i></div>
      <span class="count">${Math.min(m.prog, m.goal).toLocaleString()} / ${m.goal.toLocaleString()}</span>
      <div class="act"><button class="claim" data-m="${i}" ${!done || m.claimed ? 'disabled' : ''}>${m.claimed ? 'Claimed' : `<span class="coin"></span>${MT[m.t].reward}`}</button></div></div>`; }).join('')}
    </div>
    <div class="stats"><div><b>${st.games.toLocaleString()}</b><span>Games</span></div><div><b>${st.lines.toLocaleString()}</b><span>Lines cleared</span></div>
    <div><b>×${st.bestCombo}</b><span>Best combo</span></div><div><b>${S.best.toLocaleString()}</b><span>Best score</span></div></div>${closeBtn}`);
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = S.missions.list[+b.dataset.m]; if (m.claimed || m.prog < m.goal) return;
    m.claimed = true; S.coins += MT[m.t].reward; saveNow(); sfx.coin(); buzz(20); coinPulse(); showMissions();
  });
}
function showThemes() {
  sheet(`<h2>Themes</h2><p class="sub">Spend coins to restyle the board</p><div class="themes">
    ${THEMES.map(t => { const own = S.owned.includes(t.id), on = S.theme === t.id;
      return `<button class="theme ${on ? 'on' : ''}" data-t="${t.id}" style="background:${t.bg2};color:${t.ink}">
        <span class="sw">${t.pieces.map(c => `<i style="background:${c}"></i>`).join('')}</span><span class="nm">${t.name}</span>
        <span class="pr" style="color:${t.muted}">${on ? 'In use' : own ? 'Tap to use' : `<span class="coin"></span>${t.price}`}</span></button>`; }).join('')}
    </div>${closeBtn}`);
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = THEMES.find(x => x.id === b.dataset.t);
    if (!S.owned.includes(t.id)) {
      if (S.coins < t.price) { toast(`You need ${t.price - S.coins} more coins`); sfx.bad(); return; }
      S.coins -= t.price; S.owned.push(t.id); sfx.coin(); toast(t.name + ' unlocked!'); confetti();
    }
    S.theme = t.id; applyTheme(); saveNow(); hud(); showThemes();
  });
}
function applyTheme() {
  T = THEMES.find(t => t.id === S.theme) || THEMES[0];
  const st = document.documentElement.style;
  [['--bg1', T.bg1], ['--bg2', T.bg2], ['--ink', T.ink], ['--muted', T.muted], ['--accent', T.accent], ['--accent-ink', T.accentInk], ['--panel', T.board], ['--line', T.empty]].forEach(([k, v]) => st.setProperty(k, v));
  document.documentElement.style.colorScheme = T.id === 'citrus' ? 'light' : 'dark';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = T.bg2;
}
function soundIcon() {
  $('sndIcon').innerHTML = S.sound ? '<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>';
  $('sndLbl').textContent = S.sound ? 'Sound on' : 'Sound off';
}
$('bDaily').onclick = showDaily;
$('bMissions').onclick = showMissions;
$('bThemes').onclick = showThemes;
$('coinsBtn').onclick = showThemes;
$('bSound').onclick = () => { S.sound = !S.sound; soundIcon(); save(); if (S.sound) { audio(); sfx.coin(); } };
$('bNew').onclick = () => {
  if (!G || G.over) return;
  if (G.score === 0) { newRun(); return; }
  sheet(`<h2>Start over?</h2><p class="sub">This game ends at ${G.score.toLocaleString()} points and you keep ${Math.floor(G.score / 100)} coins.</p>
    <div class="row"><button class="btn" data-close>Keep playing</button><button class="btn primary" id="confirmNew">New game</button></div>`);
  $('confirmNew').onclick = () => { closeSheet(); const e = endRun(); if (e) coinPulse(); newRun(); };
};

/* ---------- boot ---------- */
function start(data) {
  load(data && data.save);
  applyTheme(); soundIcon(); ensureMissions();
  layout();
  const r = S.run;
  if (r && Array.isArray(r.board) && r.board.length === N * N && Array.isArray(r.tray) && !r.over) {
    G = r; shown = G.score; $('score').textContent = shown.toLocaleString();
    if (!G.tray.some(t => t)) G.tray = genTray(G.board, G.score);
  } else {
    if (r && r.over) { G = r; endRun(); }
    newRun();
  }
  trayAnim = performance.now();
  $('hint').hidden = S.seenHint;
  hud();
  new ResizeObserver(layout).observe($('stage'));
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  requestAnimationFrame(frame);
  if (G && !G.tray.some(t => t && fitsAnywhere(G.board, t))) gameOver();
  else if (S.daily.last !== today()) setTimeout(() => { if ($('modal').hidden) showDaily(); }, 700);
}
window.claude?.hot?.snapshot?.(() => { saveNow(); return { save:S }; });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
